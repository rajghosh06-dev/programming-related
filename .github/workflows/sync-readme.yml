name: Sync Repository README

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 18:29 UTC = 23:59 IST.
    - cron: "29 18 * * *"
    - cron: "29 18 1 * *"

concurrency:
  group: sync-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Decide whether this run should execute
        id: run_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.schedule }}" = "29 18 1 * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=monthly-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_count=$(git rev-list --count --since="24 hours ago" "origin/${{ github.ref_name }}")
          if [ "$commit_count" -gt 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=daily-run-with-commits" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=daily-run-no-commits" >> "$GITHUB_OUTPUT"
          fi

      - name: Log run decision
        run: |
          echo "should_run=${{ steps.run_check.outputs.should_run }}"
          echo "reason=${{ steps.run_check.outputs.reason }}"

      - name: Rebase on the latest branch tip
        if: steps.run_check.outputs.should_run == 'true'
        run: git pull --rebase --autostash origin "${{ github.ref_name }}"

      - name: Regenerate README and reports
        if: steps.run_check.outputs.should_run == 'true'
        run: python .github/readme-automation/generate_readme.py

      - name: Validate README assets
        if: steps.run_check.outputs.should_run == 'true'
        run: python .github/readme-automation/validate_readme_assets.py

      - name: Commit updated README if needed
        if: steps.run_check.outputs.should_run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync README automation"
          file_pattern: |
            README.md
            .github/profile/README.md
            .github/readme-automation/reports/language_report.json
            .github/readme-automation/reports/language_report.md
