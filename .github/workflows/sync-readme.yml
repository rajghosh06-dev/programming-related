name: Sync Repository README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  push:
    paths:
      - ".github/readme-automation/analyze_repo.py"
      - ".github/readme-automation/generate_readme.py"
      - ".github/readme-automation/data/project_directory.json"
      - ".github/readme-automation/update_project_directory.py"
      - ".github/readme-automation/validate_readme_assets.py"
      - ".github/workflows/sync-readme.yml"

concurrency:
  group: sync-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebase on the latest branch tip
        run: git pull --rebase --autostash origin "${{ github.ref_name }}"

      - name: Regenerate README and reports
        run: python .github/readme-automation/generate_readme.py

      - name: Validate README assets
        run: python .github/readme-automation/validate_readme_assets.py

      - name: Commit updated README if needed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync README automation"
          file_pattern: |
            README.md
            .github/profile/README.md
            .github/readme-automation/reports/language_report.json
            .github/readme-automation/reports/language_report.md
