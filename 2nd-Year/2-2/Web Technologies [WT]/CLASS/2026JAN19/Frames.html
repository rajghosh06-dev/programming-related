<!DOCTYPE html>
<html>
    <head>
        <title>HTML Frames Demonstration</title>
    </head>
    <!--  -->
    <frameset rows="20%,20%,20%,20%,10%" border="4">
        <!--Top Frame-->
        <frame src="menu.html" name="top">
        <!--Bottom Frames divided into columns-->
        <frameset cols="20%,20%,20%">
            <frame src="left.html" name="left">
            <frame src="content.html" name="content">
            <frame src="right.html" name="right">
        </frameset>
        <frame src="abdul.html" name="middle">
        <frameset cols="50%,50%">
            <frame src="left.html" name="left">
            <frame src="right.html" name="right">
        </frameset>
        <frameset cols="10%">
            <h1>HTML! is here</h1>
        </body>
    </frameset>
    <body>
        <h1>HTML Frames Demonstration</h1>
    </body>

    </html>
