<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>List</title>
    </head>
    <body>
        <h1>LISTS:</h1>
        <h2>Un-Ordered List</h2>
            <p>Bevarages List</p>
                <ul>
                    <li>Coffee</li>
                    <li>Milk</li>
                </ul>
        
        <h2>Ordered List</h2>
            <p>Bevarages List</p>    
                <ol>
                    <li>Coffee</li>
                        <ul>
                            <li>Cold</li>
                                <ol>
                                    <li>mild</li>
                                    <li>normal</li>
                                </ol>
                            <li>Hot</li>
                                <ul>
                                    <li>mild</li>
                                    <li>normal</li>
                                </ul>
                        </ul>
                    <li>Milk</li>
                        <ol>
                            <li>Cold</li>
                            <li>Hot</li>
                        </ol>
                </ol>


        <h2>Description List</h2>
            <p>Bevarages List</p>
                <dl>
                    <dt>Coffee</dt>
                        <dd>Black Nescafe Aroma</dd>
                    <dt>Milk</dt>
                        <dd>White Cow Milk</dd>
                </dl>
    </body>
</html>
