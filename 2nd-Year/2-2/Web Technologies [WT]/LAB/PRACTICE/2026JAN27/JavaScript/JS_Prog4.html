<html>
    <head>
        <script>
            function sayHello(name, age)
            {
                document.write(name+" is "+age+" years old.");
            }
        </script>
    </head>
    <body>
        <input type="button" value="Click to view Sara's age!" onclick="sayHello('Zara', 7)">
        <!--CUSTOM-MANUAL-PRACTICE-->
            <script>
                var Iname="Rishit Ghosh";
                var Iage="19";
            </script>
            <input type="button" value="Click to view customized age!" onclick="sayHello(Iname, Iage)">
    </body>
</html>
