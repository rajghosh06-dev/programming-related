<!DOCTYPE html>
<html>

<head>
<title>Smart Attendance Manager</title>

<link rel="stylesheet" href="style.css">

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="app">

<h1>📋 Smart Attendance Manager</h1>

<div class="input-section">
<input type="text" id="studentName" placeholder="Enter Student Name">
<button onclick="addStudent()">Add Student</button>
</div>

<div class="summary">
<span>Total Students: <b id="total">0</b></span>
<span>Present: <b id="present">0</b></span>
<span>Absent: <b id="absent">0</b></span>
</div>

<table id="attendanceTable">

<thead>
<tr>
<th>Student</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>

<button class="saveBtn" onclick="exportPDF()">Download Attendance PDF</button>

</div>

<script src="script.js"></script>

</body>
</html>
