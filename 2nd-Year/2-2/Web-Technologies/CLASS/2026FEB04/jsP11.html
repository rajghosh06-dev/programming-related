<html>
    <head>
        <title>Form Validation</title>
        <script type="text/javascript">
            function validate()
            {
                if( document.myForm.Name.value =="")
                {
                    alert("Please provide your name!");
                    document.myForm.Name.focus();
                    returnfalse;
                }
                if( document.myForm.EMail.value =="")
                {
                    alert("Please provide your Email!");
                    document.myForm.EMail.focus();
                    returnfalse;
                }
                if( document.myForm.Zip.value ==""|| isNaN( document.myForm.Zip.value )|| document.myForm.Zip.value.length !=5)
                {
                    alert("Please provide a zip in the format #####.");
                    document.myForm.Zip.focus();
                    returnfalse;
                }
                if( document.myForm.Country.value =="-1")
                {
                    alert("Please provide your country!");
                    returnfalse;
                }
                return(true);
            }
        </script>
    </head>
    <body>
        <form name="myForm" onsubmit="return validate();">
            <table border="1" cellpadding="2" cellspacing="2">
                <tr>
                    <td align="right">Name</td>
                    <td><input type="text" name="Name"></td>
                </tr>

                <tr>
                    <td align="right">Email</td>
                    <td><input type="text" name="email"></td>
                </tr>

                <tr>
                    <td align="right">Zip</td>
                    <td> <input type="text" name="ZIP"></td>
                </tr>

                <tr>
                    <td align="right">Country</td>
                    <td>
                        <select name="country">
                            <option value="-1">[Choose yours]</option>
                            <option value="1">USA</option>
                            <option value="2">UK</option>
                            <option value="3">INDIA</option>
                        </select>
                    </td>
                </tr>
            </table>
            <div align="left">
                <button type="button" text-align="center" onclick="submit()">Submit</button>
                <button type="button" text-align="center" onclick="clear()">Clear</button>
            </div>
        </form>
    </body>
</html>
