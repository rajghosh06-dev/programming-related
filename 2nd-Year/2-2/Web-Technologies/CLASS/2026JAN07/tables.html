<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>HTML in TABLE:</title>
    </head>
    <body>
        <table border="2" cellpadding="10" cellspacing="5" width="10%" align="center">
        	<caption>Simple Table Example</caption>
            <th>
                <td>Header 1</td>
                <td>Header 2</td>
            </th>
            <tr>
                <td>Row 1 Col 1</td>
                <td>Row 1 Col 2</td>
            </tr>
        </table>
    </body>
</html>
