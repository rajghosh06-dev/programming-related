<!DOCTYPE html>
<html>
<head>
  <title>Student Result Analysis</title>
  <style>
    body {
        font-family: Arial; background-color: #f0f0f0;
    }
    table {
        border-collapse: collapse; width: 60%; margin: auto;
    }
    th, td {
        border: 1px solid #333; padding: 8px; text-align: center;
    }
    th {
        background-color: #4CAF50; color: white;
    }
    tr:nth-child(even) {
        background-color: #ddd;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Result Analysis</h2>
  <table>
    <tr>
        <th>Student</th>
        <th>Subject</th>
        <th>Marks</th>
    </tr>
    <tr>
        <td>Ravi</td>
        <td>Math</td>
        <td>85</td>
    </tr>
    <tr>
        <td>Priya</td>
        <td>Science</td>
        <td>90</td>
    </tr>
    <tr>
        <td>Arjun</td>
        <td>English</td>
        <td>78</td>
    </tr>
  </table>
</body>
</html>
